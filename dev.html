        <h1>Japanese hair salon London · hairdresser Ealing Broadway</h1>
        <p>
          Yuzu Hair &amp; Beauty is a Japanese-inspired hair salon at 5 Dickens Yard, Longfield
          Avenue, Ealing, London W5 2TD, about two minutes from Ealing Broadway station. Phone
          020 8840 2244. Email info@yuzuhairandbeauty.co.uk. This Clean page is the Sept 2026
          rebuild of the salon site.
        </p>
        <p>
          Open Tuesday to Friday 10am–8pm and Saturday 9am–6pm. Monday and Sunday closed. Book
          online on
          <a href="https://www.phorest.com/salon/yuzuhairandbeauty">Phorest</a>
          or the
          <a href="https://phorest.com/book/salons/yuzuhairandbeauty">Phorest salon profile</a>.
          Get directions on
          <a href="https://maps.app.goo.gl/bhFS5wwkW3xxAdKd8">Google Maps</a>.
        </p>
        <h2>Services</h2>
        <p>
          Precision cuts and styling, colour (roots, full head, Illumina), highlights, balayage
          and foiliage, Nashi and K2.0 treatments, and Aura smoothing / Brazilian blow-dry
          (formaldehyde and ammonia free). Colour guests, including existing clients, need a
          mandatory patch test at least 48 hours before the appointment.
        </p>
        <h2>About, questions and prices</h2>
        <p>
          Meet the stylists on the <a href="about.html">about</a> page. Haircut prices, patch tests
          and hours are answered on <a href="questions.html">questions</a> — including how much is
          a haircut at Yuzu in Ealing? The senior and stylist menus live on the
          <a href="prices.html">price list</a> as HTML (a PDF remains a download). Ladies wash, cut
          and style from £58 with a stylist and £87 with a senior stylist. Gents wash, cut and
          style £58. Kids from £29. Blow-dries from £41. Full head colour from £87. Roots from
          £75. Balayage half head from £75, full head from £98. Treatments from £33. Colour
          guests, including existing clients, need a patch test at least 48 hours before. Call
          020 8840 2244 or book on Phorest.
        </p>
        <p>
          Follow
          <a href="https://www.instagram.com/yuzuhairandbeauty/">Instagram</a>,
