      <h1>Questions about Yuzu Hair &amp; Beauty in Ealing</h1>
      <p>Straight answers from the Japanese-inspired hair salon at 5 Dickens Yard, Longfield Avenue, Ealing, W5 2TD. Phone 020 8840 2244. These are the same facts as on the price list and the visit block — written so answer engines can quote them.</p>
      <h2>How much is a haircut at Yuzu in Ealing?</h2>
      <p>A ladies wash, cut and style starts at £58 with a stylist and £87 with a senior stylist. Gents wash, cut and style is £58 with a senior stylist. Kids 12 and under start at £29. Teens 13–16 from £35. Blow-dries start at £41. Colour, balayage and treatments are on the <a href="prices.html">HTML price list</a>.</p>
      <h2>Do I need a patch test before hair colour?</h2>
      <p>Yes. Colour services need a mandatory patch test for every client, including existing guests, at least 48 hours before the appointment. Book the test on Phorest. Read the <a href="patch-testing.pdf">2025 patch-testing notes</a>. We do not take walk-in colour without a patch test.</p>
      <h2>Which hair salons in Ealing are near the station?</h2>
      <p>Yuzu Hair &amp; Beauty is in Dickens Yard on Longfield Avenue, about a two-minute walk from Ealing Broadway station. It is a Japanese hair salon London visitors use in west London for cuts, colour, balayage and Brazilian blow-dry — not the Nottingham business of a similar name.</p>
      <h2>What are the opening hours?</h2>
      <p>Tuesday to Friday 10am–8pm, Saturday 9am–6pm. Monday and Sunday the salon is closed.</p>
      <h2>How do I book?</h2>
      <p>Book on <a href="https://www.phorest.com/salon/yuzuhairandbeauty">Phorest</a> or the <a href="https://phorest.com/book/salons/yuzuhairandbeauty">Phorest salon profile</a>, or call 020 8840 2244. Say whether you want a senior stylist or stylist so the price matches the chair. Email info@yuzuhairandbeauty.co.uk.</p>
      <p>More about the team is on the <a href="about.html">about</a> page. Instagram, Facebook and TikTok links are in the footer.</p>
