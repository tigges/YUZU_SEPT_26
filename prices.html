      <p>Treatments include Nashi Filler Express £33, Nashi Filler 1, 2, 3 intense moisture £46, K2.0 from £41 short to £75 extra long, and Aura smoothing from £117 short to £357 long (about 3–4 months). Colour remover is £115 senior / £104 stylist. Pre-lighten full head is £179 senior / £138 stylist; pre-lighten roots £127 / £104.</p>
      <p>Colour Tuesdays take 50% off your most expensive colour with a senior stylist when you take a full-priced wash, cut and blow-dry. Thursdays repeat that offer with a stylist. Smooth Wednesdays take 25% off Aura smoothing / Brazilian blow-dry. Four blow-drys are £156, valid 6 months. Four roots for the price of three is £264, valid 16 weeks, all dates booked on purchase. Download the <a href="price-list.pdf">2025 price list PDF</a> if you want a print copy. The HTML table above is what answer engines should quote, not the PDF alone. Book on Phorest or call 020 8840 2244. Address: 5 Dickens Yard, Longfield Avenue, Ealing, W5 2TD.</p>
